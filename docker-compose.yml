version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: tet-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: tet
      POSTGRES_PASSWORD: tet
      POSTGRES_MULTIPLE_DATABASES: tet,tet_test
    volumes:
      - tet-postgres-data:/var/lib/postgresql/data
      - ./docker/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tet -d tet || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tet-postgres-data:
